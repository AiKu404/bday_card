<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a Cat!</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="surprise2.css" />
</head>

<body>

    <!-- Blurred overlay for when a card is expanded -->
    <div id="overlay"></div>

    <div class="header-text">
        <h1>Choose a card</h1>
        <h2>Each one has something special to say about a special one✨</h2>
    </div>

    <div class="grid-container" id="cardGrid">
        <!-- Cards generated by JS -->
    </div>

    <script>
        // 22 longer, personalized messages
        const messages = [
            "Aishana🪼<br> You are a very kind🪷.<br> You help people before others even notice.",
            "You are very observant🔍. <br><br> You even notice the little details about things and people.✨",
            "You are a headstrong person. <br><br> You take your stand when you need to and you don't easily give up.💪",
            "You are the source of my energy 🔋, my inspiration 🔥 and my motivation ❤️‍🔥. <br><br>I can overcome any hurdle if I just remember YOU.",
            "You are my sunshine ☀️,<br> I love it when you smile 😊!<br><br> Your gentle touch makes me feel like the sun is gently grazing my skin.",
            "Your laughter is unhinged 🙏😹 and<br> I absolutely fricking adore it 😇.",
            "Just having you in my thoughts 💭 is enough to make me smile and brighten my day 🌟. <br>Waiting so we can spend time together again ⏳.",
            "You're the cutest, my Gellyfish 🪼.<br><br>I feel lucky to find someone as adorable as you to call mine 🍀.",
            "You have an incredible memory 🧠👏. <br><br> That incredible memory is very sharp and sometimes puts me in a lot of trouble 🔪. (just kidding...or am I? 😏)",
            "Your clumsiness is so incredibly cute 🫣.<br><br>With each stumble and fall you make 📉, I also find myself falling (for you). My love for you only increases 📈.",
            "You have a beautiful handwriting 🖋️. <br><br> I love how beautiful you make your notes and your cursive with the brush pens 🎨.",
            "You are my safe space 🏡🫂.<br><br>Thank you for being that person with whom I can be unfiltered.",
            "You take time to understand me 🫠.<br><br>Thank You for seeing me for who I am and also helping me grow 🌱.",
            "I love it when you just randomly come in for a big hug 🫂❤️.<br><br>I absolutely love those moments when we get to hug.",
            "I love your hair, its bangs, its varying lengths and the way it covers your face beautifully sometimes 💇‍♀️✨.",
            "You're very beautiful. <br><br> Both inside and out, you are so beautiful that even your heartbeats are like music to my ears 🎶💖.",
            "When you are being your kid self 🎡, and you let your inner child out 🚀, there is genuine joy in your eyes that is very contagious and makes me happy.",
            "I love your warmth very much 🩹☕. <br><br> I love how you are there for me when I am confused and hurt and how you are able to make me feel all better again 💖.",
            "I love it when you put efforts into making yourself better 🧴🧘‍♀️. <br><br> Whether you put effort into your skincare routine, your hobbies, studies or health.",
            "I love it when you relax the way you do when I put my hands in your hair and caress your hair and face 🧎‍♀️💆‍♀️.<br><br>Whenever I talk to you, everything feels right.",
            "I love it very much when you try your best and make an effort to look good 💄✨👗. <br><br> I love it when you do your little makeup and dress up. You look so damn stunning that my jaw fricking drops.",
            "Aishana, I love you! <br><br> I love everything about you, for who you are, and for who you will be. I will keep loving you for as long as you choose to stay by my side. I will keep you happy, content and make you feel loved, even more special and cherished. I will dote on you, adore you and make you feel happier."
        ];

        const gridContainer = document.getElementById('cardGrid');
        const overlay = document.getElementById('overlay');
        let activeCard = null;
        let placeholder = null;
        let isAnimating = false;

        // Generate 22 flip cards
        for (let i = 0; i < 22; i++) {
            const card = document.createElement('div');
            card.className = 'flip-card';

            card.innerHTML = `
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <img src="gift-sock.png" alt="Gift Cat ${i+1}">
          </div>
          <div class="flip-card-back">
            <p>${messages[i]}</p>
          </div>
        </div>
      `;

            card.addEventListener('click', function (e) {
                // Prevent event bubbling when card is open so window click handler works smoothly
                if (this.classList.contains('active')) {
                    e.stopPropagation();
                    closeActiveCard();
                    return;
                }

                if (isAnimating || activeCard) return;

                e.stopPropagation();
                isAnimating = true;

                const rect = this.getBoundingClientRect();

                // Create transparent placeholder
                placeholder = document.createElement('div');
                placeholder.style.width = rect.width + 'px';
                placeholder.style.height = rect.height + 'px';
                this.parentNode.insertBefore(placeholder, this);

                // Position fixed to screen
                this.style.position = 'fixed';
                this.style.top = rect.top + 'px';
                this.style.left = rect.left + 'px';
                this.style.width = rect.width + 'px';
                this.style.height = rect.height + 'px';
                this.style.margin = '0';
                this.style.zIndex = '1000'; /* Higher than overlay (500) */
                this.style.transition = 'all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1)';

                this.offsetHeight; // Force repaint

                // Target centered dimensions (~50% of screen size)
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const targetW = Math.min(Math.max(vw * 0.5, 300), 650);
                const targetH = Math.min(Math.max(vh * 0.5, 300), 650);
                const targetTop = (vh - targetH) / 2;
                const targetLeft = (vw - targetW) / 2;

                this.classList.add('active');
                this.style.top = targetTop + 'px';
                this.style.left = targetLeft + 'px';
                this.style.width = targetW + 'px';
                this.style.height = targetH + 'px';

                overlay.classList.add('show');
                activeCard = this;

                setTimeout(() => { isAnimating = false; }, 600);
            });

            gridContainer.appendChild(card);
        }

        // Function to close card smoothly
        function closeActiveCard() {
            if (!activeCard || isAnimating) return;

            isAnimating = true;
            const currentRect = placeholder.getBoundingClientRect();

            activeCard.style.top = currentRect.top + 'px';
            activeCard.style.left = currentRect.left + 'px';
            activeCard.style.width = currentRect.width + 'px';
            activeCard.style.height = currentRect.height + 'px';

            activeCard.classList.remove('active');
            overlay.classList.remove('show');

            const cardToReset = activeCard;
            activeCard = null;

            setTimeout(() => {
                cardToReset.style = '';
                if (placeholder) {
                    placeholder.remove();
                    placeholder = null;
                }
                isAnimating = false;
            }, 600);
        }

        // Clicking anywhere on the screen closes the active card
        window.addEventListener('click', () => {
            closeActiveCard();
        });
    </script>
</body>

</html>
